# NO `username` IN HERE. This file is tracked and seeds a fresh install, so a
# name left in it is one person's in-game handle published in a public repo AND
# handed to every stranger who installs the app -- whose kill-feed detector
# would then go looking for somebody else's name in their own feed. Three were
# in here. The app asks once on first use for the game that needs it and writes
# the answer to the install's OWN games.yaml, which is not this file.
games:
  dirt5.exe:
    name: DIRT 5
    scene: null
    blurb: ''
  penguinhotel-win64-shipping.exe:
    name: MECCHA CHAMELEON
    scene: null
    blurb: ''
  cs2.exe:
    name: Counter-Strike 2
    scene: null
    blurb: ''
  rainbowsix.exe:
    name: Rainbow Six Siege
    scene: null
    blurb: ''
  rainbowsix_be.exe:
    name: Rainbow Six Siege
    scene: null
    blurb: ''
  rainbowsix_vulkan.exe:
    name: Rainbow Six Siege
    scene: null
    blurb: ''
  deltaforceclient-win64-shipping.exe:
    name: Delta Force
    scene: null
    blurb: ''
  deltaforceclient.exe:
    name: Delta Force
    scene: null
    blurb: ''
  cleaner.exe:
    name: Serial Cleaner
    scene: null
    blurb: ''
  # The name matters here, not just as a label. catalog._game_exe resolves a
  # launcher-started game to the process it will actually run under by matching
  # this display name -- and VALORANT is started by RiotClientServices.exe, so
  # without the mapping "Open + stream" launches the game and then never goes
  # live, because launch_intent is keyed on the wrong executable.
  #
  # It was resolving through the PUBLIC index instead, which is a download. On
  # any machine that had not fetched it yet -- every fresh install, and every
  # clone of this repo -- the lookup came back empty and fell through to the
  # launcher's own name. Tracked here, it works offline and on first run.
  valorant-win64-shipping.exe:
    name: VALORANT
blocklist:
# DEVELOPER TOOLS THE PUBLIC INDEX CALLS GAMES. Short executable names collide,
# and the index matches on the bare name with nothing to corroborate it -- so a
# terminal command was enough to start a public broadcast. This happened for
# real: `gh` (the GitHub CLI) went live as Green Hell.
#   gh.exe      -> Green Hell        the GitHub CLI
#   rg.exe      -> Retro Gadgets     ripgrep
#   dotnet.exe  -> tModLoader        the .NET runtime, which idles on many PCs
#   ninja.exe   -> Mini Ninjas       the build tool
