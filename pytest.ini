[pytest]
testpaths = tests

# The default run is offline and needs nothing installed: no network, no OBS,
# no YouTube account, no sample footage. Everything that needs one of those is
# marked and excluded here, so `pytest -q` stays the thing you can run on any
# machine at any time. scripts\verify.ps1 is what opts back in, one tier at a
# time and deliberately.
addopts = -m "not media and not build and not live"

markers =
    media: needs the sample-footage corpus (see tests/verify/corpus.py). Runs the real detectors against real recordings and scores them against a reviewed baseline. Minutes, not seconds.
    build: needs dist\AutoStream\AutoStream.exe. Launches the built binary and drives it over HTTP, so it catches PyInstaller packaging breakage that no offline test can see.
    live: reaches REAL OBS and creates a REAL private YouTube broadcast, then deletes it. Costs quota, needs OBS running, and can never run unattended.
