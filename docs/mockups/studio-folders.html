<title>Studio Folders</title>
<style>
:root{
  --bg: #0C1016;
  --chrome: #090D12;
  --surface: #12171F;
  --surface-raised: #1A212B;
  --surface-sunken: #080B10;
  --surface-overlay: #1F2732;
  --surface-hover: #171D27;
  --surface-active: #222A36;
  --border-subtle: #1F2833;
  --border-strong: #68768A;
  --border-focus: #58A6FF;
  --text-primary: #E9EFF7;
  --text-secondary: #AAB8C9;
  --text-tertiary: #909EB0;
  --text-on-accent: #04121F;
  --text-on-ok: #04121F;
  --accent: #4D9FFF;
  --accent-hover: #6FB2FF;
  --accent-text: #7CB8FF;
  --accent-muted: #0D1B2B;
  --live: #FF6B6B;
  --live-muted: #2A0F11;
  --ok: #4FC97A;
  --ok-muted: #0A1A11;
  --warn: #E3AC3B;
  --warn-muted: #1E1708;
  --danger: #FF7A70;
  --danger-muted: #2B100E;
  --idle: #909EB0;
  --idle-muted: #161B23;
  --track: #1C242F;
  --shadow-color: rgba(2,5,10,.62);
  --rim: rgba(255,255,255,.055);
  --scrim: rgba(4,7,12,.66);
  --selection: rgba(77,159,255,.30);
  --text-on-danger: #1A0706;
  --text-on-warn: #1A1305;
  --fg: #E9EFF7;
  --dim: #AAB8C9;
  --faint: #909EB0;
  --line: #1F2833;
  --raised: #1A212B;
  --accent-fg: #04121F;
  --radius:10px; --radius-lg:14px; --radius-pill:999px;
  --gutter:28px; --rail-w:216px;
  --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-text:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --on-media:#fff; --on-media-scrim:rgba(0,0,0,.62);
  --shadow-md:0 2px 4px -1px rgba(0,0,0,.5), 0 6px 14px -4px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font:14px/1.45 var(--font-text);
  -webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* ---- the shell, only so the mockup reads as the real page ---- */
.rail{width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--chrome);
  border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:0 10px 14px}
.brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 8px;font:600 15px/1 var(--font-display)}
.brand .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--text-secondary);
  display:grid;place-items:center;font-size:11px}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;
  color:var(--text-secondary);text-decoration:none;font-size:13.5px}
.nav a.on{background:var(--surface-active);color:var(--text-primary)}
.nav a .ic{width:16px;text-align:center;opacity:.8}
.rail .foot{margin-top:auto;color:var(--text-tertiary);font-size:11.5px;padding:0 10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--gutter);border-bottom:1px solid var(--border-subtle);background:var(--chrome)}
.topbar h1{margin:0;font:600 19px/1 var(--font-display)}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:var(--radius-pill);
  background:var(--surface-raised);border:1px solid var(--border-subtle);color:var(--text-secondary);
  font-size:12px;letter-spacing:.04em}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--text-tertiary)}
.page{padding:22px var(--gutter) 60px;max-width:1340px}
h2{font:600 15px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-secondary);margin:30px 0 14px}
.muted{color:var(--text-tertiary)}
.sub{color:var(--text-secondary);margin:2px 0 18px}

/* ---- buttons / chips, as the app draws them ---- */
.btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--border-subtle);
  background:var(--surface-raised);color:var(--text-primary);font:500 13px var(--font-text);cursor:pointer}
.btn:hover{background:var(--surface-hover)}
.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px}
.chip{height:28px;padding:0 12px;border-radius:var(--radius-pill);border:1px solid var(--border-subtle);
  background:var(--surface);color:var(--text-secondary);font-size:12.5px;cursor:pointer;margin:0 6px 6px 0}
.chip.on{background:var(--surface-active);color:var(--text-primary);border-color:var(--border-strong)}
.chip b{color:var(--text-primary);margin-left:4px}
input.search{height:30px;width:260px;padding:0 10px;border-radius:8px;background:var(--surface-sunken);
  border:1px solid var(--border-subtle);color:var(--text-primary);font:13px var(--font-text)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-tertiary);margin-bottom:6px}
.crumbs a{color:var(--text-secondary);text-decoration:none;cursor:pointer}
.crumbs a:hover{color:var(--text-primary);text-decoration:underline}
.title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.title-row h3{margin:0;font:600 22px/1.2 var(--font-display)}

/* ---- level 1: folders ---- */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px}
.folder-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;display:block;
  transition:transform .14s,border-color .14s,box-shadow .14s}
.folder-card:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.mosaic{display:grid;overflow:hidden;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:16/9;
  background:var(--surface-sunken)}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic.one{grid-template-columns:1fr;grid-template-rows:1fr}
.folder-body{padding:12px 14px 14px;display:block}
.folder-name{font:600 15px/1.2 var(--font-display);display:flex;align-items:center;gap:8px}
.folder-facts{color:var(--text-tertiary);font-size:12.5px;margin-top:5px;display:block}
.folder-card .go{color:var(--accent-text);font-size:12.5px;margin-top:10px;display:block}
.fav-card .mosaic{display:grid;overflow:hidden;place-items:center;font-size:42px;color:var(--text-tertiary)}

/* ---- level 2: runs in a folder ---- */
.runs{display:flex;flex-direction:column;gap:10px}
.run{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border-subtle);
  border-radius:var(--radius);padding:10px 14px 10px 10px;cursor:pointer}
.run:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.run img{width:112px;height:63px;object-fit:cover;border-radius:7px;flex:0 0 auto;background:var(--surface-sunken)}
.run .who{flex:1;min-width:0}
.run .nm{font:600 14.5px/1.2 var(--font-display)}
.run .fx{color:var(--text-tertiary);font-size:12.5px;margin-top:4px}
.mchips{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.mchip{font-size:11.5px;padding:2px 9px;border-radius:var(--radius-pill);background:var(--surface-sunken);
  border:1px solid var(--border-subtle);color:var(--text-secondary)}
.mchip.win{border-color:#2f5d3f;color:#9fdcb4}
.mchip.loss{border-color:#5d3030;color:#e4a7a7}
.run .acts{display:flex;gap:8px;align-items:center;flex:0 0 auto}

/* ---- level 3: matches and clips ---- */
.match{margin:0 0 26px}
.match-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 12px;border-radius:9px;
  background:var(--surface);border:1px solid var(--border-subtle);margin-bottom:12px}
.match-h .n{font:600 14.5px var(--font-display)}
.match-h .score{font:600 13px var(--font-mono);padding:2px 8px;border-radius:6px;background:var(--surface-sunken)}
.match-h .score.win{color:#9fdcb4} .match-h .score.loss{color:#e4a7a7}
.match-h .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
.clip{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius);overflow:hidden}
.clip .shot{position:relative;display:block;aspect-ratio:16/9;background:var(--surface-sunken)}
.clip .shot img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;bottom:6px;font-size:11px;color:var(--on-media);background:var(--on-media-scrim);
  padding:2px 6px;border-radius:5px;line-height:1.3}
.badge.l{left:6px} .badge.r{right:6px;font-family:var(--font-mono)}
.clip .foot{display:flex;align-items:center;gap:6px;padding:7px 8px}
.clip .foot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;
  color:var(--text-secondary)}
.star{background:none;border:0;color:var(--text-tertiary);cursor:pointer;font-size:14px;padding:0 2px}
.star.on{color:#f4c04a}
.note{margin:18px 0 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);
  border-radius:0 9px 9px 0;color:var(--text-secondary);font-size:13px;max-width:900px}
.note b{color:var(--text-primary)}
.reels-bar{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border-subtle);
  border-radius:var(--radius);padding:11px 14px;color:var(--text-secondary)}
.reels-bar b{color:var(--text-primary)}
.ph{display:block;width:100%;height:100%;background:repeating-linear-gradient(135deg,var(--surface-raised) 0 10px,var(--surface-sunken) 10px 20px);opacity:.55}
.stamp{position:absolute;right:18px;top:68px;font-size:11px;color:var(--text-tertiary);
  background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);padding:4px 12px}
</style>
</head>

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dur = s => { s = Math.round(s); const m = Math.floor(s / 60); return m ? m + 'm ' + String(s % 60).padStart(2, '0') + 's' : s + 's'; };
const long = s => { s = Math.round(s); if (s < 60) return s + 's'; const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? h + 'h ' + m + 'm' : m + 'm'; };
let view = {at: 'folders', game: null, folder: null};

function clipTile(c) {
  return '<div class="clip"><span class="shot">' +
    (c.thumb ? '<img src="' + c.thumb + '" alt="">' : '<span class="ph"></span>') +
    '<span class="badge l">' + c.kills + (c.kills === 1 ? ' kill' : ' kills') +
      (c.hs ? ' · ' + c.hs + ' HS' : '') + '</span>' +
    '<span class="badge r">' + dur(c.dur) + '</span></span>' +
    '<div class="foot"><span class="nm">' + esc(c.name) + '</span>' +
    '<button class="star' + (c.fav ? ' on' : '') + '">' + (c.fav ? '★' : '☆') + '</button>' +
    '<button class="btn ghost sm">Edit</button>' +
    '<button class="btn ghost sm">▷</button></div></div>';
}

function folders() {
  const g = DATA.games;
  const runs = g.reduce((n, x) => n + x.folders.length, 0);
  let h = '<div class="title-row"><h3>Your clips</h3></div>' +
    '<p class="sub">' + DATA.clip_count + ' clips in ' + runs + ' runs across ' + g.length +
    ' games. Open a folder to pick from it.</p>' +
    '<div class="reels-bar"><b>Your reels</b><span>' + DATA.reels + ' made</span>' +
    '<span style="flex:1"></span><button class="btn">Open reels</button></div>' +
    '<h2>Folders</h2>' +
    '<div class="toolbar"><input class="search" placeholder="Search a game, a date, a clip…">' +
    '<button class="chip on">Newest</button><button class="chip">Most clips</button>' +
    '<button class="chip">A–Z</button></div><div class="folders">';
  g.forEach((x, i) => {
    const newest = x.folders[0] ? x.folders[0].label.split(' · ')[0] : '';
    h += '<button class="folder-card" data-game="' + i + '">' +
      '<span class="mosaic">' + x.covers.map(t => t ? '<img src="' + t + '" alt="">' : '<span class="ph"></span>').join('') + '</span>' +
      '<span class="folder-body"><span class="folder-name">' + esc(x.game) + '</span>' +
      '<span class="folder-facts">' + x.clips + ' clips · ' + x.folders.length +
      (x.folders.length === 1 ? ' run' : ' runs') + '<br>newest ' + esc(newest) + '</span>' +
      '<span class="go">Open →</span></span></button>';
  });
  h += '<button class="folder-card fav-card"><span class="mosaic">★</span>' +
    '<span class="folder-body"><span class="folder-name">Favourites</span>' +
    '<span class="folder-facts">' + DATA.fav_count + ' clips · across every game</span>' +
    '<span class="go">Open →</span></span></button></div>' +
    '<p class="note"><b>What changed:</b> the page opens on ' + (g.length + 1) +
    ' cards instead of ' + DATA.clip_count + ' clip tiles in one scroll. Nothing is lost — ' +
    'the search box still looks inside every folder.</p>';
  return h;
}

function runs() {
  const g = DATA.games[view.game];
  let h = '<div class="crumbs"><a data-back="folders">Folders</a> › <span>' + esc(g.game) + '</span></div>' +
    '<div class="title-row"><h3>' + esc(g.game) + '</h3><span class="muted">' + g.clips +
    ' clips in ' + g.folders.length + ' runs</span></div>' +
    '<div class="toolbar"><input class="search" placeholder="Search this folder…">' +
    '<button class="chip on">Newest</button><button class="chip">Most kills</button>' +
    '<button class="btn ghost">Select every clip in this folder</button></div><div class="runs">';
  g.folders.forEach((f, i) => {
    const ms = f.matches || [];
    h += '<div class="run" data-folder="' + i + '">' +
      (f.cover ? '<img src="' + f.cover + '" alt="">' : '<span class="ph" style="width:112px;height:63px;border-radius:7px;flex:0 0 auto"></span>') +
      '<div class="who"><div class="nm">' + esc(f.label) + '</div>' +
      '<div class="fx">' + f.n + (f.n === 1 ? ' clip' : ' clips') + ' · ' + f.kills + (f.kills === 1 ? ' kill · ' : ' kills · ') +
      long(f.secs) + ' of footage' + (ms.length ? ' · ' + ms.length + (ms.length === 1 ? ' match' : ' matches') : '') + '</div>' +
      (ms.length ? '<div class="mchips">' + ms.map(m => '<span class="mchip ' +
        (m.won === true ? 'win' : m.won === false ? 'loss' : '') + '">' + esc(m.map) + ' · ' +
        (m.score ? m.score.join('–') : m.mode) + '</span>').join('') + '</div>' : '') +
      '</div><div class="acts"><button class="btn ghost sm">Select run</button>' +
      '<button class="btn sm">Open</button></div></div>';
  });
  h += '</div><p class="note"><b>A run is a sitting at the PC</b>, which is what the folder on disk is. ' +
    'The matches inside it come from the Riot records AutoStream already saved.</p>';
  return h;
}

function clips() {
  const g = DATA.games[view.game], f = g.folders[view.folder];
  let h = '<div class="crumbs"><a data-back="folders">Folders</a> › <a data-back="runs">' + esc(g.game) +
    '</a> › <span>' + esc(f.label) + '</span></div>' +
    '<div class="title-row"><h3>' + esc(f.label) + '</h3><span class="muted">' + f.n + ' clips · ' +
    f.kills + ' kills · ' + long(f.secs) + '</span>' +
    '<span style="flex:1"></span><button class="btn ghost sm">Select the whole run</button></div>' +
    '<p class="sub">Grouped by the match each clip was cut from.</p>';
  const ms = f.matches || [];
  if (!ms.length) {
    h += '<div class="grid">' + f.clips.map(clipTile).join('') + '</div>';
    return h;
  }
  ms.forEach((m, i) => {
    const won = m.won === true ? 'win' : m.won === false ? 'loss' : '';
    h += '<section class="match"><div class="match-h">' +
      '<span class="n">Match ' + (i + 1) + ' · ' + esc(m.map) + '</span>' +
      '<span class="muted">' + esc(m.mode) + '</span>' +
      (m.score ? '<span class="score ' + won + '">' + m.score.join(' – ') + '</span>' : '') +
      '<span class="muted">' + (m.kda[0] != null ? m.kda.join(' / ') + ' K/D/A' : '') + '</span>' +
      '<span class="muted">' + m.n + ' clips · ' + m.kills + ' kills · ' + long(m.secs) + '</span>' +
      '<span class="muted">at ' + long(m.at) + ' into the recording</span>' +
      '<span class="sp"></span><button class="btn ghost sm">Select match</button></div>' +
      '<div class="grid">' + m.clips.map(clipTile).join('') +
      (m.n > m.clips.length ? '<div class="clip" style="display:grid;place-items:center;color:var(--text-tertiary);' +
        'min-height:150px">+ ' + (m.n - m.clips.length) + ' more</div>' : '') +
      '</div></section>';
  });
  h += '<p class="note"><b>Every one of these headings is already on disk.</b> The match offsets are in the ' +
    'run\'s <code>session.json</code>, and the map, the mode and the score are in the Riot record the ' +
    'Clips page already fetched. The Studio has simply never read them.</p>';
  return h;
}

function render() {
  const page = document.getElementById('page');
  page.innerHTML = view.at === 'folders' ? folders() : view.at === 'runs' ? runs() : clips();
  page.querySelectorAll('[data-game]').forEach(el => el.onclick = () => {
    view = {at: 'runs', game: +el.dataset.game, folder: null}; render();
  });
  page.querySelectorAll('[data-folder]').forEach(el => el.onclick = () => {
    view.folder = +el.dataset.folder; view.at = 'clips'; render();
  });
  page.querySelectorAll('[data-back]').forEach(el => el.onclick = () => {
    view.at = el.dataset.back; render();
  });
  window.scrollTo(0, 0);
}
render();
window.mock = {go: (at, game, folder) => { view = {at, game, folder}; render(); }};
</script>
