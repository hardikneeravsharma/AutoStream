# The offline test suite, on Windows and on macOS, for the platforms a change
# can affect. scripts/ci_changes.py decides which: Mac-only files test the Mac,
# Windows-only files test Windows, docs test neither, everything else both.
#
# The filter is inside the workflow (a job `if:`), never on the trigger: a job
# skipped by its `if:` reports success, so "Windows tests" and "macOS tests"
# can both be REQUIRED checks in branch protection and a docs-only PR still
# merges. A trigger-level `paths:` filter would leave them pending forever.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:          # run both on any branch, from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which platforms
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.f.outputs.windows }}
      macos: ${{ steps.f.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: python3 scripts/ci_changes.py "${{ github.event.pull_request.base.sha || github.event.before }}" | tee -a "$GITHUB_OUTPUT"

  windows:
    name: Windows tests
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Gyan's build, as winget installs it -- it has libass and drawtext.
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  macos:
    name: macOS tests
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The full build: the plain formula has no drawtext or ass (docs/MACOS.md).
      - run: brew install ffmpeg-full
      # The interpreter setup-python installed: Homebrew's has no tkinter.
      - run: PYTHON=python scripts/macos/install.sh --dev
      - run: .venv/bin/python -m pytest -q
