# Attach the macOS app to a GitHub release (issue #193).
#
# Releases are cut on the Windows machine, which has no Mac to build on, so
# the Mac build follows the release rather than holding it up: publishing a
# release starts this, and it uploads AutoStream-macos-<arch>.dmg (+ .sha256)
# beside the Windows files. The names carry no version, so
#   releases/latest/download/AutoStream-macos-arm64.dmg
# is always the newest Mac build.
#
# Run it by hand (Actions > macOS release > Run workflow) to attach the Mac
# build to a release that was published before this existed, or to rebuild one.
name: macOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the Mac build to (e.g. v1.78.0)"
        required: true

permissions:
  contents: write            # to upload release assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Two builds rather than one universal app: numpy and friends ship no
        # universal2 wheels, so a universal Python app cannot be assembled.
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: scripts/macos/install.sh --dev

      # The Mac-specific tests only. The whole offline suite has already gated
      # this release on Windows, and parts of it need the full ffmpeg build,
      # which is a long Homebrew install to repeat on every release.
      - name: Test
        run: .venv/bin/python -m pytest -q -p no:randomly tests/macos

      - name: Build
        run: scripts/macos/build.sh --dist --no-tests

      - name: Attach to the release
        run: gh release upload "$TAG" dist/macos/AutoStream-macos-*.dmg dist/macos/AutoStream-macos-*.dmg.sha256 --clobber
